<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../style.css">
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: transparent;
    font-family: 'Zpix', 'Microsoft YaHei', monospace;
    -webkit-font-smoothing: none;
  }
  #gameApp {
    background: #0f1a2e;
    border: 2px solid #3a3a5c;
    box-shadow: inset 0 0 0 1px #5a5a8c;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #gameApp .drag-bar {
    height: 28px;
    -webkit-app-region: drag;
    width: 100%;
    flex-shrink: 0;
  }
  #catch-the-cat {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
  }
  #catch-the-cat canvas {
    display: block;
  }
  #gameControls {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    width: 100%;
    justify-content: flex-end;
    box-sizing: border-box;
  }
  #gameControls .btn-game {
    background: #1a2540;
    color: #c0c0c0;
    border: 1px solid #3a3a5c;
    font-family: 'Zpix', 'Microsoft YaHei', monospace;
    font-size: 11px;
    padding: 3px 10px;
    cursor: pointer;
    -webkit-font-smoothing: none;
  }
  #gameControls .btn-game:hover {
    color: #e6b800;
    border-color: #e6b800;
  }
  #gameControls .credit-link {
    color: #5a5a8c;
    font-size: 10px;
    text-decoration: none;
    margin-right: auto;
  }
  #gameControls .credit-link:hover {
    color: #8a8abc;
  }
</style>
<title>捉猫</title>
</head>
<body>
<div id="gameApp">
  <div class="drag-bar"></div>
  <div id="catch-the-cat"></div>
  <div id="gameControls">
    <a class="credit-link" href="#" onclick="window.electronAPI.openExternal('https://github.com/ganlvtech/phaser-catch-the-cat')">phaser-catch-the-cat</a>
    <button class="btn-game" id="btnUndo" title="回退">回退</button>
    <button class="btn-game" id="btnReset" title="重置">重置</button>
    <button class="btn-hide" id="btnClose" title="关闭" onclick="window.close()">✕</button>
  </div>
</div>

<script>
  Object.defineProperty(window, 'devicePixelRatio', { get: () => 1 });
</script>
<script src="phaser.min.js"></script>
<script src="catch-the-cat.js"></script>
<script>
  window.game = new CatchTheCatGame({
    w: 11,
    h: 11,
    r: 17,
    initialWallCount: 8,
    backgroundColor: 0x0f1a2e,
    parent: 'catch-the-cat',
    statusBarAlign: 'center'
  });

  var scene = window.game.scene.scenes[0];
  document.getElementById('btnReset').addEventListener('click', function() { scene.reset(); });
  document.getElementById('btnUndo').addEventListener('click', function() { scene.undo(); });
</script>
</body>
</html>
