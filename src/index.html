<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<title>MoreMoney</title>
</head>
<body>
<div id="app">
  <canvas id="particleCanvas"></canvas>
  <div class="drag-bar" id="dragBar"></div>

  <div class="status-row">
    <span class="status-dot" id="statusDot"></span>
    <span class="status-text" id="statusText">工作中</span>
    <span class="multiplier-tag" id="multiplierTag">1x</span>
    <span class="status-time" id="statusTime"></span>
  </div>

  <div class="amount-section">
    <div class="amount-label">已获得</div>
    <div class="amount-value" id="amountValue">0.000000</div>
    <div class="amount-unit" id="amountUnit">
      <span id="eqIcon">🧋</span>
      <span id="eqName">奶茶</span>
    </div>
  </div>

  <div class="progress-section">
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill">
        <div class="progress-shine"></div>
      </div>
    </div>
    <div class="progress-label">
      <span id="progressStart">09:00</span>
      <span id="progressPercent">0%</span>
      <span id="progressEnd">17:30</span>
    </div>
  </div>

  <div class="actions">
    <button class="btn-settings" id="btnSettings" title="设置" onclick="window.electronAPI.openSettings()">⚙</button>
    <button class="btn-hide" id="btnHide" title="最小化到托盘" onclick="window.electronAPI.hideWindow()">━</button>
  </div>
</div>

<script src="main-renderer.js"></script>
</body>
</html>
