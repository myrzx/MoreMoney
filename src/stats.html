<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<title>工时统计</title>
</head>
<body>
<div id="statsApp">
  <div class="drag-bar" id="dragBar"></div>

  <div class="stats-header">
    <button class="nav-btn" id="btnPrevMonth">&lt;</button>
    <span class="month-title" id="monthTitle">2026年5月</span>
    <button class="nav-btn" id="btnNextMonth">&gt;</button>
  </div>

  <div class="calendar-weekdays">
    <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
  </div>

  <div class="calendar-grid" id="calendarGrid"></div>

  <div class="summary-card" id="summaryCard">
    <div class="summary-row">
      <span class="summary-label">工作天数</span>
      <span class="summary-value" id="sumDays">0 天</span>
    </div>
    <div class="summary-row">
      <span class="summary-label">总工时</span>
      <span class="summary-value" id="sumHours">0 小时</span>
    </div>
    <div class="summary-row">
      <span class="summary-label">总收入</span>
      <span class="summary-value" id="sumEarned">￥0</span>
    </div>
    <div class="summary-row">
      <span class="summary-label">日均收入</span>
      <span class="summary-value" id="sumAvg">￥0</span>
    </div>
  </div>

  <div class="actions">
    <button class="btn-hide" id="btnClose" title="关闭">✕</button>
  </div>
</div>

<script src="stats-renderer.js"></script>
</body>
</html>
