<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<style>
  body { display: flex; justify-content: center; align-items: center; height: 100vh; background: transparent; }
  #settings-app {
    width: 420px;
    max-height: 540px;
    overflow-y: auto;
    background: linear-gradient(135deg, #0a0e1a 0%, #111827 50%, #0a0e1a 100%);
    border: 1px solid rgba(34, 211, 238, 0.2);
    border-radius: 16px;
    padding: 28px 24px 20px;
    box-shadow: 0 0 30px rgba(6, 182, 212, 0.08);
    color: #d1d5db;
    position: relative;
  }
  .settings-drag { height: 32px; -webkit-app-region: drag; cursor: grab; position: absolute; top: 0; left: 0; right: 0; z-index: 1; }
  .settings-title { font-size: 16px; font-weight: 600; color: #fbbf24; margin-bottom: 20px; text-align: center; }
  .settings-section { margin-bottom: 18px; }
  .settings-label { font-size: 11px; color: #9ca3af; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .settings-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .settings-input {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    color: #e5e7eb;
    padding: 8px 12px;
    font-size: 13px;
    width: 100%;
    outline: none;
    transition: border-color 0.2s;
    -webkit-app-region: no-drag;
  }
  .settings-input:focus { border-color: #22d3ee; }
  .settings-input.time-input { width: 130px; flex: none; }
  .btn-primary {
    background: linear-gradient(135deg, #06b6d4, #0891b2);
    border: none;
    color: white;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    -webkit-app-region: no-drag;
  }
  .btn-primary:hover { box-shadow: 0 0 16px rgba(6, 182, 212, 0.4); }
  .btn-danger {
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: #fca5a5;
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 11px;
    cursor: pointer;
    -webkit-app-region: no-drag;
  }
  .btn-danger:hover { background: rgba(239, 68, 68, 0.3); }
  .equiv-list { max-height: 180px; overflow-y: auto; }
  .equiv-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 4px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    font-size: 13px;
    cursor: pointer;
    -webkit-app-region: no-drag;
  }
  .equiv-item:hover { background: rgba(255,255,255,0.02); border-radius: 6px; }
  .equiv-item.selected { background: rgba(34,211,238,0.06); border-radius: 6px; }
  .equiv-item input[type="radio"] { accent-color: #22d3ee; cursor: pointer; }
  .equiv-item .name { flex: 1; }
  .equiv-item .price { color: #fbbf24; font-variant-numeric: tabular-nums; margin-right: 4px; }
  .add-equiv-row { display: flex; gap: 6px; margin-top: 8px; }
  .close-btn {
    position: absolute; top: 6px; right: 14px;
    background: none; border: none; color: #6b7280; font-size: 20px; cursor: pointer;
    z-index: 10; -webkit-app-region: no-drag;
  }
  .close-btn:hover { color: #fbbf24; }

  .wday-label { display: flex; align-items: center; gap: 4px; font-size: 12px; color: #9ca3af; cursor: pointer; padding: 2px 4px; -webkit-app-region: no-drag; }
  .wday-label input[type="checkbox"] { accent-color: #22d3ee; }

  #settings-app::-webkit-scrollbar { width: 4px; }
  #settings-app::-webkit-scrollbar-track { background: transparent; }
  #settings-app::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }

  input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(0.7); cursor: pointer; }
</style>
<title>MoreMoney 设置</title>
</head>
<body>
<div id="settings-app">
  <div class="settings-drag"></div>
  <button class="close-btn" id="btnClose" onclick="window.close()">✕</button>
  <div class="settings-title">⚙ 薪资设置</div>

  <div class="settings-section">
    <div class="settings-label">月薪（元）</div>
    <input class="settings-input" id="inputSalary" type="number" step="100" min="0">
  </div>

  <div class="settings-section">
    <div class="settings-label">工作时间</div>
    <div class="settings-row">
      <input class="settings-input time-input" id="inputWorkStart" type="time">
      <span style="color:#6b7280">至</span>
      <input class="settings-input time-input" id="inputWorkEnd" type="time">
    </div>
  </div>

  <div class="settings-section">
    <div class="settings-label">工作日</div>
    <div class="settings-row" id="workDaysCheckboxes">
      <label class="wday-label"><input type="checkbox" value="1"> 周一</label>
      <label class="wday-label"><input type="checkbox" value="2"> 周二</label>
      <label class="wday-label"><input type="checkbox" value="3"> 周三</label>
      <label class="wday-label"><input type="checkbox" value="4"> 周四</label>
      <label class="wday-label"><input type="checkbox" value="5"> 周五</label>
      <label class="wday-label"><input type="checkbox" value="6"> 周六</label>
      <label class="wday-label"><input type="checkbox" value="7"> 周日</label>
    </div>
  </div>

  <div class="settings-section">
    <div class="settings-label">等价物（单选切换，右侧为单价/元）</div>
    <div class="equiv-list" id="equivList"></div>
    <div class="add-equiv-row">
      <input class="settings-input" id="inputEqName" placeholder="名称" style="flex:1">
      <input class="settings-input" id="inputEqIcon" placeholder="图标" style="width:56px;flex:none">
      <input class="settings-input" id="inputEqPrice" placeholder="单价" type="number" min="0" step="1" style="width:72px;flex:none">
      <button class="btn-primary" id="btnAddEquiv">+</button>
    </div>
  </div>

  <div class="settings-section">
    <button class="btn-primary" id="btnSave" style="width:100%" onclick="window.__saveSettings()">保存设置</button>
  </div>
</div>

<script src="settings-renderer.js"></script>
</body>
</html>
