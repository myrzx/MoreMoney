<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<style>
  body { display: flex; justify-content: center; align-items: center; height: 100vh; background: transparent; font-family: 'Zpix', monospace; -webkit-font-smoothing: none; }
  #settingsApp {
    width: 500px;
    height: 560px;
    background: #0f1a2e;
    border: 2px solid #3a3a5c;
    box-shadow: inset 0 0 0 1px #5a5a8c;
    position: relative;
    overflow: hidden;
    color: #f5f0dc;
  }
  #settings-app {
    width: 100%;
    height: 100%;
    overflow-y: auto;
    padding: 32px 24px 40px;
  }
  .settings-drag { height: 28px; -webkit-app-region: drag; cursor: grab; position: absolute; top: 0; left: 0; right: 0; z-index: 1; }
  .settings-section { margin-bottom: 18px; }
  .settings-label { font-size: 11px; color: #8a8a9a; text-transform: uppercase; letter-spacing: 0; margin-bottom: 6px; }
  .settings-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .settings-input {
    background: #0a1020;
    border: 1px solid #3a3a5c;
    border-radius: 0;
    color: #f5f0dc;
    padding: 8px 12px;
    font-size: 13px;
    font-family: 'Zpix', monospace;
    width: 100%;
    outline: none;
    -webkit-app-region: no-drag;
  }
  .settings-input:focus { border-color: #e6b800; }
  .settings-input.time-input { width: 130px; flex: none; }
  .btn-primary {
    background: #1a2540;
    border: 1px solid #3a3a5c;
    color: #e6b800;
    border-radius: 0;
    padding: 8px 16px;
    font-size: 13px;
    font-family: 'Zpix', monospace;
    cursor: pointer;
    -webkit-app-region: no-drag;
    box-shadow: inset 0 0 0 1px #5a5a8c;
  }
  .btn-primary:hover { background: #2a3550; border-color: #e6b800; }
  .btn-danger {
    background: #1a2540;
    border: 1px solid #5c3a3a;
    color: #f87171;
    border-radius: 0;
    padding: 4px 10px;
    font-size: 11px;
    font-family: 'Zpix', monospace;
    cursor: pointer;
    -webkit-app-region: no-drag;
  }
  .btn-danger:hover { background: #2a1520; border-color: #f87171; }
  .eye-btn {
    background: #1a2540;
    border: 1px solid #3a3a5c;
    color: #8a8a9a;
    width: 36px;
    height: 36px;
    border-radius: 0;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-app-region: no-drag;
    flex-shrink: 0;
    box-shadow: inset 0 0 0 1px #5a5a8c;
  }
  .eye-btn:hover { background: #2a3550; color: #e6b800; border-color: #e6b800; }
  .equiv-list { max-height: 180px; overflow-y: auto; }
  .equiv-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 4px;
    border-bottom: 1px solid #1a1a30;
    font-size: 13px;
    cursor: pointer;
    -webkit-app-region: no-drag;
  }
  .equiv-item:hover { background: #1a2540; }
  .equiv-item.selected { background: #1a2540; border-left: 2px solid #e6b800; }
  .equiv-item input[type="radio"] { accent-color: #e6b800; cursor: pointer; }
  .equiv-item .name { flex: 1; }
  .equiv-item .price { color: #e6b800; font-variant-numeric: tabular-nums; margin-right: 4px; }
  .add-equiv-row { display: flex; gap: 6px; margin-top: 8px; }
  .break-item {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 4px; font-size: 13px;
    border-bottom: 1px solid #1a1a30;
  }
  .break-item .break-time { flex: 1; color: #a78bfa; }
  #settingsApp .actions {
    position: absolute;
    bottom: 8px;
    right: 12px;
  }

  .wday-label { display: flex; align-items: center; gap: 4px; font-size: 12px; color: #8a8a9a; cursor: pointer; padding: 2px 4px; -webkit-app-region: no-drag; }
  .wday-label input[type="checkbox"] { accent-color: #e6b800; }

  #settings-app::-webkit-scrollbar { width: 4px; }
  #settings-app::-webkit-scrollbar-track { background: #0a1020; }
  #settings-app::-webkit-scrollbar-thumb { background: #3a3a5c; }

  input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(0.7); cursor: pointer; }
</style>
<title>MoreMoney 设置</title>
</head>
<body>
<div id="settingsApp">
  <div class="settings-drag"></div>

  <div id="settings-app">
    <div class="settings-section">
      <div class="settings-label">每月大米（￥）</div>
      <div class="settings-row">
        <input class="settings-input" id="inputSalary" type="password" step="100" min="0" style="flex:1">
        <button class="eye-btn" id="btnEye" type="button">👁</button>
      </div>
    </div>

    <div class="settings-section">
      <div class="settings-label">工作时间</div>
      <div class="settings-row">
        <input class="settings-input time-input" id="inputWorkStart" type="time">
        <span style="color:#6b7280">至</span>
        <input class="settings-input time-input" id="inputWorkEnd" type="time">
      </div>
    </div>

    <div class="settings-section">
      <div class="settings-label">休息时间（不计工时）</div>
      <div class="break-list" id="breakList"></div>
      <div class="settings-row" style="margin-top:8px">
        <input class="settings-input time-input" id="inputBreakStart" type="time">
        <span style="color:#6b7280">至</span>
        <input class="settings-input time-input" id="inputBreakEnd" type="time">
        <button class="btn-primary" id="btnAddBreak">+</button>
      </div>
    </div>

    <div class="settings-section">
      <div class="settings-label">下班提醒</div>
      <div class="settings-row" style="align-items:center;gap:12px">
        <label class="wday-label"><input type="checkbox" id="inputReminder"> 到点提醒下班</label>
        <button class="btn-primary" id="btnTestReminder" style="margin-left:auto">测试提醒</button>
      </div>
    </div>

    <div class="settings-section">
      <div class="settings-label">等价物（单选切换，右侧为单价/元）</div>
      <div class="equiv-list" id="equivList"></div>
      <div class="add-equiv-row">
        <input class="settings-input" id="inputEqName" placeholder="名称" style="flex:1">
        <input class="settings-input" id="inputEqIcon" placeholder="图标" style="width:56px;flex:none">
        <input class="settings-input" id="inputEqPrice" placeholder="单价" type="number" min="0" step="1" style="width:72px;flex:none">
        <button class="btn-primary" id="btnAddEquiv">+</button>
      </div>
    </div>

    <div class="settings-section">
      <button class="btn-primary" id="btnSave" style="width:100%" onclick="window.__saveSettings()">保存设置</button>
    </div>
  </div>

  <div class="actions">
    <button class="btn-hide" id="btnClose" title="关闭" onclick="window.close()">✕</button>
  </div>
</div>

<script src="settings-renderer.js"></script>
</body>
</html>
