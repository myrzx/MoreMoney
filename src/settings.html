<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<style>
  body { display: flex; justify-content: center; align-items: center; height: 100vh; }
  #settings-app {
    width: 420px;
    max-height: 520px;
    overflow-y: auto;
    background: linear-gradient(135deg, #0a0e1a 0%, #111827 50%, #0a0e1a 100%);
    border: 1px solid rgba(34, 211, 238, 0.2);
    border-radius: 16px;
    padding: 28px 24px 20px;
    box-shadow: 0 0 40px rgba(6, 182, 212, 0.12), 0 12px 40px rgba(0,0,0,0.7);
    color: #d1d5db;
  }
  .settings-drag { height: 20px; -webkit-app-region: drag; cursor: grab; position: absolute; top: 8px; left: 0; right: 0; }
  .settings-title { font-size: 16px; font-weight: 600; color: #fbbf24; margin-bottom: 18px; text-align: center; }
  .settings-section { margin-bottom: 18px; }
  .settings-label { font-size: 11px; color: #9ca3af; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .settings-row { display: flex; gap: 10px; align-items: center; }
  .settings-input {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    color: #e5e7eb;
    padding: 8px 12px;
    font-size: 13px;
    width: 100%;
    outline: none;
    transition: border-color 0.2s;
  }
  .settings-input:focus { border-color: #22d3ee; }
  .settings-input.small { width: 80px; flex: none; }
  .btn-primary {
    background: linear-gradient(135deg, #06b6d4, #0891b2);
    border: none;
    color: white;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-primary:hover { box-shadow: 0 0 16px rgba(6, 182, 212, 0.4); }
  .btn-danger {
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: #fca5a5;
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 11px;
    cursor: pointer;
  }
  .equiv-list { max-height: 160px; overflow-y: auto; }
  .equiv-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 4px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    font-size: 13px;
  }
  .equiv-item .name { flex: 1; }
  .equiv-item .price { color: #fbbf24; font-variant-numeric: tabular-nums; }
  .equiv-item .selected-mark { color: #22d3ee; font-size: 16px; visibility: hidden; }
  .equiv-item.selected .selected-mark { visibility: visible; }
  .equiv-item.selected { background: rgba(34,211,238,0.06); border-radius: 6px; }
  .equiv-item:hover { background: rgba(255,255,255,0.02); border-radius: 6px; }
  .add-equiv-row { display: flex; gap: 6px; margin-top: 6px; }
  .close-btn {
    position: absolute; top: 10px; right: 14px;
    background: none; border: none; color: #6b7280; font-size: 20px; cursor: pointer;
  }
  .close-btn:hover { color: #fbbf24; }

  #settings-app::-webkit-scrollbar { width: 4px; }
  #settings-app::-webkit-scrollbar-track { background: transparent; }
  #settings-app::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }
</style>
<title>MoreMoney 设置</title>
</head>
<body>
<div id="settings-app">
  <div class="settings-drag"></div>
  <button class="close-btn" id="btnClose">✕</button>
  <div class="settings-title">⚙ 薪资设置</div>

  <div class="settings-section">
    <div class="settings-label">月薪（元）</div>
    <input class="settings-input" id="inputSalary" type="number" step="100" min="0">
  </div>

  <div class="settings-section">
    <div class="settings-label">工作时间</div>
    <div class="settings-row">
      <input class="settings-input small" id="inputWorkStart" type="text" placeholder="09:00">
      <span style="color:#6b7280">至</span>
      <input class="settings-input small" id="inputWorkEnd" type="text" placeholder="17:30">
    </div>
  </div>

  <div class="settings-section">
    <div class="settings-label">工作日</div>
    <div class="settings-row" id="workDaysCheckboxes">
      <label><input type="checkbox" value="1"> 一</label>
      <label><input type="checkbox" value="2"> 二</label>
      <label><input type="checkbox" value="3"> 三</label>
      <label><input type="checkbox" value="4"> 四</label>
      <label><input type="checkbox" value="5"> 五</label>
      <label><input type="checkbox" value="6"> 六</label>
      <label><input type="checkbox" value="7"> 日</label>
    </div>
  </div>

  <div class="settings-section">
    <div class="settings-label">等价物（点击选中，右侧为单价/元）</div>
    <div class="equiv-list" id="equivList"></div>
    <div class="add-equiv-row">
      <input class="settings-input" id="inputEqName" placeholder="名称" style="flex:1">
      <input class="settings-input" id="inputEqIcon" placeholder="图标" style="width:60px;flex:none">
      <input class="settings-input" id="inputEqPrice" placeholder="单价" type="number" min="0" step="1" style="width:80px;flex:none">
      <button class="btn-primary" id="btnAddEquiv">+</button>
    </div>
  </div>

  <div class="settings-section">
    <button class="btn-primary" id="btnSave" style="width:100%">保存设置</button>
  </div>
</div>

<script src="settings-renderer.js"></script>
</body>
</html>
